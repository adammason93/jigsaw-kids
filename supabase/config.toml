# Supabase local / deploy config — extend as your project grows.
# See: https://supabase.com/docs/guides/cli/config

# Allow EdgeRuntime.waitUntil background work to finish locally (storybook_async jobs).
[edge_runtime]
policy = "per_worker"

[api]
enabled = true

[functions.clever-service]
# Kids’ hub uses anon key without login for games; this keeps the function callable from the static site.
# Lock down with Dashboard rate limits + budgets; consider JWT or a shared header secret for production.
verify_jwt = false

[functions.game-maker]
# Make a 3D Game. The gateway checks the bearer JWT. The function also rejects
# the public anon key (it is a valid JWT, but not a signed-in user).
# The live slug is `dynamic-action` — see the next section. Source stays here.
verify_jwt = true

[functions.dynamic-action]
entrypoint = "./functions/game-maker/index.ts"
verify_jwt = true

[functions.learn-generate]
verify_jwt = true

[functions.learn-visuals]
verify_jwt = true

[functions.child-art]
# Browser preflight has no JWT, so the gateway does not verify it.
# child-art rejects missing, anon, and service-role bearers itself.
# Do not deploy until this review is approved. Do not enable pairing for the deploy.
verify_jwt = false

[functions.child-pair]
# A device has no user session yet. It posts the public anon key plus one pairing code.
# The function redeems that code with the service role. Do not deploy until
# 20261008220000 through 20261008250000 are applied. Leave CHILD_PAIRING_ENABLED
# unset for the public rollout. Set it to 1 only for the controlled pairing test.
verify_jwt = false
