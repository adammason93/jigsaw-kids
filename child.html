<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex" />
  <title>Join your Wondii</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/family.css?v=11" />
</head>
<body class="family-child">
  <main class="family-join" id="childJoin">
    <a class="family-brand" href="child.html">
      <img src="games/images/brand/wondi-wordmark.svg" alt="Wondii" />
    </a>
    <p class="family-kicker">A grown-up’s code</p>
    <h1 class="family-child__hello">Join your Wondii</h1>
    <p class="family-lead">Ask a grown-up for a pairing code. It works once, and only for a few minutes.</p>
    <form id="childPair" class="family-join__form">
      <label class="family-field">Pairing code
        <input class="family-code-input" name="code" autocomplete="one-time-code" inputmode="text" maxlength="8" required />
      </label>
      <button class="family-btn" type="submit">Join</button>
    </form>
    <p id="childPairStatus" class="family-status" role="status"></p>
  </main>
  <script src="js/score-config.js"></script>
  <script src="js/wondii-session.js"></script>
  <script src="js/wondii-crew.js"></script>
  <script src="js/child-library.js?v=2" defer></script>
  <script src="js/child-join.js?v=6" defer></script>
</body>
</html>
