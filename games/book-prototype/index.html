  <script>
    (function () {
      if (window.WondiiBookData && window.WondiiBookData.prepareReader) {
        window.WondiiBookData.prepareReader();
      }
      var params;
      try { params = new URLSearchParams(window.location.search); } catch (e) { return; }
      if (!params.has("book")) return;
      document.title = "Opening this book — Wondii";
      var brand = document.querySelector(".brand span");
      if (!brand) return;
      var watch = new MutationObserver(function () {
        if (brand.textContent !== "Book unavailable") return;
        document.title = "Book unavailable — Wondii";
        watch.disconnect();
      });
      watch.observe(brand, { childList: true, characterData: true, subtree: true });
    })();
  </script>
