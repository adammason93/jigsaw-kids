print{position:absolute;left:0;right:0;bottom:3.2%;z-index:1;margin:0;display:flex;align-items:center;justify-content:center;gap:.4rem;pointer-events:none;}.cover-imprint img{height:clamp(10px,2.6cqi,16px);width:auto;}.cover-imprint span{font-family:"Fredoka","Nunito",sans-serif;font-size:clamp(.48rem,2.15cqi,.68rem);font-weight:600;letter-spacing:.16em;text-transform:uppercase;}.cover[data-contrast="light"] .cover-imprint span{color:#fff6ea;text-shadow:0 1px 2px rgba(20,18,40,.4);}.cover[data-contrast="dark"] .cover-imprint span{color:#24304a;}.cover.is-thumb{width:132px;border-radius:8px;box-shadow:0 8px 16px rgba(20,27,77,.12);}@media (max-width:640px){.cover{width:min(340px,88vw);}}</style></head><body><article class="cover" data-family="wide-two-line" data-treatment="offset" data-contrast="light" data-title-region="upper" style="--title-top:8%;--title-bottom:auto;--title-max:30%;"><img class="cover-art" src="images/cover.jpg" alt=""/><h1 class="cover-title" style="top:8%;"><span class="cover-line"><span class="cover-word is-connector">A</span> <span class="cover-word is-primary">Blink</span></span><span class="cover-line"><span class="cover-word is-connector">for</span> <span class="cover-word is-connector">the</span> <span class="cover-word is-primary">Sky</span></span></h1><p class="cover-imprint"><img src="../../../../games/images/brand/wondi-wordmark.svg" alt=""/><span>A Wondii Story</span></p></article></body></html>
