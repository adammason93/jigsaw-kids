<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>A Blink for the Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet"/>
<style id="cover-css"></style>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 62%, #e3dbd2 0%, #b7ab9e 74%);color:#3a332c;font-family:Nunito,system-ui,sans-serif;}
.stage{width:min(1080px,96vw);padding:28px 0 48px;}
.nav{display:flex;justify-content:space-between;align-items:center;margin:0 8px 12px;opacity:.72;}
.nav button{font:600 .92rem Nunito,sans-serif;background:transparent;border:0;color:#5e564c;cursor:pointer;padding:.35rem .15rem;}
.nav button:disabled{opacity:.28;cursor:default;}
.book{margin:0 auto;position:relative;}
.book.is-closed{width:min(400px,78vw);aspect-ratio:1024/1536;perspective:1800px;filter:drop-shadow(0 18px 28px rgba(48,36,24,.18));}
.book.is-closed .cover-shell,.book.is-closed .cover{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;box-shadow:none;border-radius:3px 12px 12px 3px;}
.book.is-open{width:min(1040px,94vw);perspective:3000px;background:transparent;padding:2px 10px 28px;}
.book.is-open.is-turning{perspective:1280px;}
.book.is-narrow{width:min(720px,96vw);padding:8px 8px 14px;perspective:none;}
.block{position:relative;transform:rotateX(1.6deg);transform-origin:center 74%;transform-style:preserve-3d;}
.book.is-narrow .block{transform:none;}
.deck{position:relative;padding:0 14px 20px;border-radius:4px 12px 10px 4px;transform-style:preserve-3d;background:repeating-linear-gradient(to bottom,#fffdf8 0 4px,#8d6848 4px 8px);box-shadow:0 12px 16px rgba(32,20,12,.22);}
.book.is-narrow .deck{padding:0;background:transparent;border-radius:0;}
.book.is-open::after{content:"";position:absolute;z-index:-1;left:1%;right:1%;bottom:1px;height:22px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(32,20,12,.55),rgba(32,20,12,0) 70%);pointer-events:none;}
.spread{position:relative;z-index:1;aspect-ratio:3/2;overflow:visible;background:#f7f1e6;border-radius:4px 10px 10px 4px;transform-style:preserve-3d;}
.page{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background:#f7f1e6;}
.page-left{left:0;transform-origin:right center;transform:rotateY(var(--tilt,1.8deg));border-radius:5px 0 0 6px;}
.page-right{right:0;transform-origin:left center;transform:rotateY(calc(var(--tilt,1.8deg) * -1));border-radius:0 10px 10px 0;}
.page-art{position:absolute;top:0;height:100%;width:200%;max-width:none;object-fit:cover;display:block;}
.page-left .page-art{left:0;}
.page-right .page-art{left:-100%;}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;}
.page-left::after{background:linear-gradient(90deg,rgba(255,250,242,.1),transparent 5%,transparent 70%,rgba(32,18,10,.14) 90%,rgba(20,10,6,.3));}
.page-right::after{background:linear-gradient(270deg,rgba(255,250,242,.08),transparent 5%,transparent 70%,rgba(32,18,10,.14) 90%,rgba(20,10,6,.3));}
.spread-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.spread-art.is-sample{visibility:hidden;pointer-events:none;z-index:0;}
.story{position:absolute;margin:0;z-index:4;font-family:Nunito,sans-serif;text-align:left;visibility:hidden;}
.story.is-ready{visibility:visible;}
.story-line{display:block;}
.story.is-shadow.is-dark{text-shadow:0 1px 1px rgba(255,248,238,.5);}
.story.is-shadow.is-light{text-shadow:0 1px 2px rgba(24,18,14,.28);}
.story.is-halo.is-dark{text-shadow:0 0 1px rgba(255,248,238,.75),0 1px 2px rgba(255,248,238,.4);}
.story.is-halo.is-light{text-shadow:0 0 1px rgba(20,14,10,.4),0 1px 2px rgba(20,14,10,.25);}
.story.is-scrim::before{content:"";position:absolute;z-index:-1;left:-.55em;right:-.55em;top:-.4em;bottom:-.4em;border-radius:1.4em;}
.story.is-scrim.is-dark::before{background:radial-gradient(ellipse at center,rgba(255,248,238,.38),rgba(255,248,238,0) 72%);}
.story.is-scrim.is-light::before{background:radial-gradient(ellipse at center,rgba(18,14,16,.26),rgba(18,14,16,0) 70%);}
.gutter{position:absolute;left:50%;top:0;bottom:0;width:70px;transform:translateX(-50%) translateZ(8px);z-index:5;pointer-events:none;background:linear-gradient(90deg,rgba(24,14,8,0) 0%,rgba(24,14,8,.1) 14%,rgba(20,12,6,.28) 34%,rgba(14,8,4,.48) 47%,rgba(8,4,2,.55) 49.3%,rgba(255,250,242,.8) 50%,rgba(8,4,2,.55) 50.7%,rgba(14,8,4,.48) 53%,rgba(20,12,6,.28) 66%,rgba(24,14,8,.1) 86%,rgba(24,14,8,0) 100%);}
.gutter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(#fffdf8,#eadcc4 50%,#f6efe3);box-shadow:1px 0 0 rgba(18,10,4,.5),-1px 0 0 rgba(18,10,4,.5);}
.edge{position:absolute;top:0;bottom:0;width:4.5%;z-index:3;border:0;padding:0;background:transparent;cursor:pointer;}
.edge-prev{left:0;}
.edge-next{right:0;}
.debug-label{position:absolute;left:10px;bottom:8px;z-index:6;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(20,24,40,.45);padding:.12rem .4rem;border-radius:999px;}
.under,.leaf{position:absolute;top:0;bottom:0;width:50%;z-index:6;}
.under{background-size:200% 100%;background-repeat:no-repeat;z-index:3;}
.under.is-next,.leaf.is-next{right:0;}
.under.is-prev,.leaf.is-prev{left:0;}
.under.is-next{background-position:right center;}
.under.is-prev{background-position:left center;}
.leaf{transform-style:preserve-3d;z-index:7;}
.leaf.is-next{transform-origin:left center;}
.leaf.is-prev{transform-origin:right center;}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;}
.under{overflow:hidden;}
.under img,.leaf .front img{position:absolute;top:0;height:100%;width:200%;max-width:none;object-fit:cover;}
.under.is-next img,.leaf.is-next .front img{left:-100%;}
.under.is-prev img,.leaf.is-prev .front img{left:0;}
.leaf.is-next .front{background-position:right center;}
.leaf.is-prev .front{background-position:left center;}
.leaf .back{background:linear-gradient(90deg,rgba(62,44,28,.16),rgba(62,44,28,0) 24%),linear-gradient(#f8f2e8,#efe3d2);transform:rotateY(180deg);box-shadow:inset 0 0 22px rgba(70,50,30,.1);}
.sheet-edge{position:absolute;top:0;bottom:0;width:6px;background:linear-gradient(90deg,#f3e6d2,#fffaf3 40%,#d9c4a6);box-shadow:-1px 0 0 rgba(80,58,36,.22);pointer-events:none;}
.leaf.is-next .sheet-edge{right:0;}
.leaf.is-prev .sheet-edge{left:0;}
.leaf.is-next .face{border-radius:0 6px 6px 0;}
.leaf.is-prev .face{border-radius:6px 0 0 6px;}
.cast{position:absolute;top:0;bottom:0;width:54%;z-index:4;pointer-events:none;background:transparent;}
.cast.is-next{right:0;}
.cast.is-prev{left:0;}
.leaf.go.is-next{animation:turnNext var(--turn,680ms) cubic-bezier(.4,.05,.2,1) forwards;}
.leaf.go.is-prev{animation:turnPrev var(--turn,680ms) cubic-bezier(.4,.05,.2,1) forwards;}
.cast.go.is-next{animation:shadeNext var(--turn,680ms) ease-in-out forwards;}
.cast.go.is-prev{animation:shadePrev var(--turn,680ms) ease-in-out forwards;}
@keyframes turnNext{
  0%{transform:rotateY(calc(var(--tilt,1.8deg) * -1)) translateZ(0)}
  42%{transform:rotateY(-62deg) translateZ(26px)}
  58%{transform:rotateY(-108deg) translateZ(22px)}
  100%{transform:rotateY(-180deg) translateZ(0)}
}
@keyframes turnPrev{
  0%{transform:rotateY(var(--tilt,1.8deg)) translateZ(0)}
  42%{transform:rotateY(62deg) translateZ(26px)}
  58%{transform:rotateY(108deg) translateZ(22px)}
  100%{transform:rotateY(180deg) translateZ(0)}
}
@keyframes shadeNext{
  0%{background:linear-gradient(90deg,rgba(28,16,8,0),rgba(28,16,8,0));transform:translateX(12%)}
  38%{background:linear-gradient(90deg,rgba(28,16,8,.5),rgba(28,16,8,0) 68%);transform:translateX(-4%)}
  70%{background:linear-gradient(90deg,rgba(28,16,8,.28),rgba(28,16,8,0) 62%);transform:translateX(-46%)}
  100%{background:linear-gradient(90deg,rgba(28,16,8,0),rgba(28,16,8,0));transform:translateX(-82%)}
}
@keyframes shadePrev{
  0%{background:linear-gradient(270deg,rgba(28,16,8,0),rgba(28,16,8,0));transform:translateX(-12%)}
  38%{background:linear-gradient(270deg,rgba(28,16,8,.5),rgba(28,16,8,0) 68%);transform:translateX(4%)}
  70%{background:linear-gradient(270deg,rgba(28,16,8,.28),rgba(28,16,8,0) 62%);transform:translateX(46%)}
  100%{background:linear-gradient(270deg,rgba(28,16,8,0),rgba(28,16,8,0));transform:translateX(82%)}
}
.book.is-opening .cover-shell{transform-origin:left center;animation:openCover var(--turn,680ms) ease-in forwards;}
@keyframes openCover{to{transform:rotateY(-20deg) translateX(-6%);opacity:0}}
.book.is-closing .spread{animation:closeBook var(--turn,680ms) ease-in forwards;}
@keyframes closeBook{to{opacity:.15;transform:scale(.985)}}
.book.is-narrow .gutter,.book.is-narrow .page{display:none;}
.book.is-narrow .spread-art.is-sample{visibility:visible;position:absolute;}
@media (max-width:759px){
  .book.is-narrow .story{text-align:left;}
}
@media (prefers-reduced-motion:reduce){
  .leaf,.book.is-opening .cover-shell,.book.is-closing .spread{animation:none !important;}
}
</style>
</head>

<script>
var DATA = {"openings":[{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p1","role":"double-page-spread","image":"images/p1.jpg","text":"A flicker caught Maya's eye beneath the flowerpot. She looked up at the sky. When she looked back, the gap was dark.","textSide":"left","textSafeRegion":"upper-left"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p2","role":"double-page-spread","image":"images/p2.jpg","text":"Maya bent down beside the flowerpot. Under its rim, a star had tucked its points inward. \"Here,\" she whispered, holding out an open hand.","textSide":"right","textSafeRegion":"upper-right"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p3","role":"double-page-spread","image":"images/p3.jpg","text":"The star climbed onto her palm. Maya pointed up. Its points folded tight again.","textSide":"left","textSafeRegion":"upper-left"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p4","role":"double-page-spread","image":"images/p4.jpg","text":"Maya cupped both hands around the star. One point opened, then another. A single blink shone against her fingers.","textSide":"right","textSafeRegion":"upper-right"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p5","role":"double-page-spread","image":"images/p5.jpg","text":"She opened her hands. Closed them. Opened them again. The star answered: blink, blink.","textSide":"left","textSafeRegion":"upper-left"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p6","role":"double-page-spread","image":"images/p6.jpg","text":"Maya lifted the star towards the narrow patch of sky. It blinked twice. She waited, but no light blinked back.","textSide":"right","textSafeRegion":"upper-right"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p7","role":"double-page-spread","image":"images/p7.jpg","text":"The star tucked its points against Maya's thumb. She tipped her head back. The wall hid so much of the sky.","textSide":"left","textSafeRegion":"upper-left"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p8","role":"double-page-spread","image":"images/p8.jpg","text":"Into the open garden, Maya carried the star. She kept one hand beside it. Above them, lights dotted the wide sky.","textSide":"right","textSafeRegion":"upper-right"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p9","role":"double-page-spread","image":"images/p9.jpg","text":"On her palm, the star unfolded. It tried two blinks. Two distant lights blinked back.","textSide":"left","textSafeRegion":"upper-left"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p10","role":"double-page-spread","image":"images/p10.jpg","text":"Maya opened her hands. The star rose into the sky, blinking as it went. The distant lights kept answering.","textSide":"right","textSafeRegion":"upper-right"}]},{"kind":"double-page-spread","provisional":true,"authoredAs":"single-landscape","pages":[{"id":"p11","role":"double-page-spread","image":"images/p11.jpg","text":"Her empty hands opened and closed once more. One star blinked back. Maya's yellow sleeves settled beneath its light.","textSide":"left","textSafeRegion":"upper-left"}]}],"coverHtml":"\u003carticle class=\"cover\" data-family=\"phrase-stack\" data-treatment=\"restrained\" data-contrast=\"light\" data-title-region=\"upper\" style=\"--title-top:8%;--title-bottom:auto;--title-max:30%;\">\u003cimg class=\"cover-art\" src=\"images/cover.jpg\" alt=\"\"/>\u003ch1 class=\"cover-title\" style=\"top:8%;\">\u003cspan class=\"cover-line\">\u003cspan class=\"cover-word is-connector\">A\u003c/span> \u003cspan class=\"cover-word is-primary\">Blink\u003c/span>\u003c/span>\u003cspan class=\"cover-line\">\u003cspan class=\"cover-word is-connector\">for\u003c/span> \u003cspan class=\"cover-word is-connector\">the\u003c/span>\u003c/span>\u003cspan class=\"cover-line\">\u003cspan class=\"cover-word is-primary\">Sky\u003c/span>\u003c/span>\u003c/h1>\u003cp class=\"cover-imprint\">\u003cimg src=\"../../../../../games/images/brand/wondi-wordmark.svg\" alt=\"\"/>\u003cspan>A Wondii Story\u003c/span>\u003c/p>\u003c/article>","coverCss":"body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1ea;font-family:Nunito,system-ui,sans-serif;color:#24304a;}.cover{container-type:inline-size;position:relative;width:min(440px,92vw);aspect-ratio:1024/1536;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px rgba(20,27,77,.16);background:#1c2438;}.cover-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}.cover-title{position:absolute;left:13%;right:13%;z-index:1;max-height:var(--title-max,30%);margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:\"Fredoka\",\"Nunito\",sans-serif;font-weight:600;font-size:clamp(0.78rem,8.1cqi,2.65rem);line-height:.9;letter-spacing:.01em;}.cover-line{display:block;}.cover-word{display:inline-block;}.cover-word.is-connector{font-weight:500;font-size:.78em;letter-spacing:.045em;}.cover-word.is-primary{font-weight:600;}.cover[data-treatment=\"hierarchy\"] .cover-word.is-connector{font-size:.62em;font-weight:500;}.cover[data-treatment=\"hierarchy\"] .cover-word.is-primary{font-size:1.16em;}.cover[data-treatment=\"hierarchy\"] .cover-title{gap:.02em;}.cover[data-treatment=\"offset\"] .cover-line:nth-child(odd){transform:translateX(-.22em);}.cover[data-treatment=\"offset\"] .cover-line:nth-child(even){transform:translateX(.38em);}.cover[data-contrast=\"light\"] .cover-title{color:#fff8ee;text-shadow:0 1px 0 rgba(20,18,40,.16),0 8px 16px rgba(16,18,40,.28);}.cover[data-contrast=\"dark\"] .cover-title{color:#24304a;text-shadow:0 1px 0 rgba(255,252,246,.55);}.cover[data-family=\"phrase-stack\"] .cover-line:nth-child(2){margin:.02em 0 .06em;}.cover-imprint{position:absolute;left:0;right:0;bottom:3.2%;z-index:1;margin:0;display:flex;align-items:center;justify-content:center;gap:.4rem;pointer-events:none;}.cover-imprint img{height:clamp(10px,2.6cqi,16px);width:auto;}.cover-imprint span{font-family:\"Fredoka\",\"Nunito\",sans-serif;font-size:clamp(.48rem,2.15cqi,.68rem);font-weight:600;letter-spacing:.16em;text-transform:uppercase;}.cover[data-contrast=\"light\"] .cover-imprint span{color:#fff6ea;text-shadow:0 1px 2px rgba(20,18,40,.4);}.cover[data-contrast=\"dark\"] .cover-imprint span{color:#24304a;}.cover.is-thumb{width:132px;border-radius:8px;box-shadow:0 8px 16px rgba(20,27,77,.12);}@media (max-width:640px){.cover{width:min(340px,88vw);}}","reader":{"yearGroup":"Year 2","stage":"year2","constraintYear":"Year 2"}};
var Reader = window.WondiiBookReader;
var Type = window.WondiiBookType;
var reducedQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
var narrowQuery = window.matchMedia("(max-width: 759px)");
var root = document.getElementById("book");
var session = null;
var startX = null;

function escapeText(text) {
  return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function boot() {
  document.getElementById("cover-css").textContent = DATA.coverCss;
  session = Reader.createSession({
    openings: DATA.openings,
    reducedMotion: reducedQuery.matches,
    narrow: narrowQuery.matches,
    debug: /(?:^|[?&])debug=1(?:&|$)/.test(location.search)
  });
  render();
}

function render() {
  var view = Reader.presentation(session);
  var prev = document.getElementById("prev");
  var next = document.getElementById("next");
  prev.disabled = session.mode === "cover" || session.animating;
  next.disabled = session.animating || (session.mode === "open" && session.index >= session.openings.length - 1);
  if (view.layout === "closed-cover") {
    root.className = "book is-closed";
    root.innerHTML = '<div class="cover-shell">' + DATA.coverHtml + "</div>";
    return;
  }
  var page = view.opening.pages[0];
  var narrow = view.layout === "single-page";
  var src = escapeText(page.image);
  root.className = "book is-open" + (narrow ? " is-narrow" : "");
  var label = view.debugLabels ? '<span class="debug-label">' + escapeText(page.id) + "</span>" : "";
  var gutter = narrow ? "" : '<div class="gutter" aria-hidden="true"></div>';
  var faces = narrow
    ? '<img class="spread-art" alt="" src="' + src + '">'
    : '<div class="page page-left"><img class="page-art" alt="" src="' + src + '"></div>' +
      '<div class="page page-right"><img class="page-art" alt="" src="' + src + '"></div>' +
      '<img class="spread-art is-sample" alt="" src="' + src + '">';
  root.innerHTML = '<div class="block"><div class="deck"><div class="spread">' +
    faces +
    '<p class="story"></p>' +
    gutter + label +
    '<button type="button" class="edge edge-prev" aria-label="Previous page"></button>' +
    '<button type="button" class="edge edge-next" aria-label="Next page"></button></div></div></div>';
  root.querySelector(".edge-prev").addEventListener("click", function () { go("previous"); });
  root.querySelector(".edge-next").addEventListener("click", function () { go("next"); });
  fitStory(root.querySelector(".spread-art"), page, narrow);
}

function channel(value) {
  var c = value / 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

function sampleImage(img, box) {
  var canvas = document.createElement("canvas");
  var width = 16;
  var height = 10;
  canvas.width = width;
  canvas.height = height;
  var ctx = canvas.getContext("2d", { willReadFrequently: true });
  var sx = Math.max(0, box.x * img.naturalWidth);
  var sy = Math.max(0, box.y * img.naturalHeight);
  var sw = Math.max(1, box.w * img.naturalWidth);
  var sh = Math.max(1, box.h * img.naturalHeight);
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, width, height);
  var data = ctx.getImageData(0, 0, width, height).data;
  var grid = [];
  var index;
  for (index = 0; index < data.length; index += 4) {
    grid.push(0.2126 * channel(data[index]) + 0.7152 * channel(data[index + 1]) + 0.0722 * channel(data[index + 2]));
  }
  return { grid: grid, width: width, height: height };
}

function fitStory(img, page, narrow) {
  function run() {
    var spread = img.parentElement;
    if (!spread || !Type) return;
    var layout = Type.place({
      text: page.text,
      profile: DATA.reader,
      textSafeRegion: page.textSafeRegion || (page.textSide === "right" ? "upper-right" : "upper-left"),
      pageRole: narrow ? "single-page" : (page.role || "double-page-spread"),
      spreadWidth: spread.clientWidth,
      spreadHeight: spread.clientHeight,
      sample: function (box) { return sampleImage(img, box); }
    });
    var story = spread.querySelector(".story");
    if (!story) return;
    var look = Type.styleFor(layout);
    story.className = "story is-ready is-" + layout.ink + " is-" + layout.treatment;
    story.innerHTML = Type.markup(layout);
    story.style.left = look.left;
    story.style.top = look.top;
    story.style.width = look.width;
    story.style.fontSize = look.fontSize;
    story.style.lineHeight = look.lineHeight;
    story.style.fontWeight = look.fontWeight;
    story.style.color = look.color;
    story.style.textAlign = look.textAlign;
  }
  if (img.complete && img.naturalWidth) run();
  else img.addEventListener("load", run);
}

function go(direction) {
  if (!session || session.animating) return;
  var fromMode = session.mode;
  var fromIndex = session.index;
  var result = Reader.command(session, { direction: direction });
  if (!result.ok) return;
  session = result.session;
  document.getElementById("prev").disabled = true;
  document.getElementById("next").disabled = true;
  if (!result.animate) {
    render();
    return;
  }
  root.style.setProperty("--turn", result.durationMs + "ms");
  if (fromMode === "cover" || (session.pending && session.pending.mode === "cover")) {
    root.classList.add(fromMode === "cover" ? "is-opening" : "is-closing");
    window.setTimeout(finish, result.durationMs);
    return;
  }
  playLeaf(direction, fromIndex, session.pending.index, result.durationMs);
}

function finish() {
  session = Reader.finishTurn(session);
  render();
}

function playLeaf(direction, fromIndex, toIndex, duration) {
  var spread = root.querySelector(".spread");
  if (!spread || root.classList.contains("is-narrow")) {
    window.setTimeout(finish, duration);
    return;
  }
  var from = DATA.openings[fromIndex].pages[0];
  var to = DATA.openings[toIndex].pages[0];
  var side = direction === "next" ? "is-next" : "is-prev";
  var under = document.createElement("div");
  under.className = "under " + side;
  var cast = document.createElement("div");
  cast.className = "cast " + side;
  var leaf = document.createElement("div");
  leaf.className = "leaf " + side;
  leaf.innerHTML = '<div class="face front"><img alt="" src="' + from.image + '"><span class="sheet-edge"></span></div><div class="face back"></div>';
  under.innerHTML = '<img alt="" src="' + to.image + '">';
  root.classList.add("is-turning");
  spread.appendChild(under);
  spread.appendChild(cast);
  spread.appendChild(leaf);
  void leaf.offsetWidth;
  leaf.classList.add("go");
  cast.classList.add("go");
  window.setTimeout(finish, duration);
}

document.getElementById("prev").addEventListener("click", function () { go("previous"); });
document.getElementById("next").addEventListener("click", function () { go("next"); });
document.addEventListener("keydown", function (event) {
  if (event.key === "ArrowRight") go("next");
  if (event.key === "ArrowLeft") go("previous");
});
root.addEventListener("touchstart", function (event) {
  startX = event.changedTouches[0].clientX;
}, { passive: true });
root.addEventListener("touchend", function (event) {
  if (startX == null) return;
  var dx = event.changedTouches[0].clientX - startX;
  startX = null;
  if (Math.abs(dx) < 48) return;
  go(dx < 0 ? "next" : "previous");
}, { passive: true });
narrowQuery.addEventListener("change", function () {
  if (!session || session.animating) return;
  session.narrow = narrowQuery.matches;
  render();
});
boot();
</script>
</body>
